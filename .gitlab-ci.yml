workflow:
  rules:
    # Production delivery is tag-driven. Merge requests and default-branch
    # changes still run validation, but never deploy the live Swarm service.
    - if: '$CI_COMMIT_TAG =~ /^(dev|staging|prod)-[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - Dockerfile
        - proxy/**
        - docs-site/**
        - docs/**
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - Dockerfile
        - proxy/**
        - docs-site/**
        - docs/**
        - .gitlab-ci.yml
    - when: never

stages:
  - validate
  - test
  - release_guard
  - registry
  - build
  - migrate
  - deploy
  - verify

variables:
  # The protected Mac runner provides Docker-in-Docker rootless for build jobs.
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: /certs
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  DOCKER_DRIVER: overlay2
  DOCKER_BUILDKIT: "1"
  GOTOOLCHAIN: local
  RELEASE_BRANCH: main

.proxy_rules:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^(dev|staging|prod)-[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - Dockerfile
        - proxy/**
        - docs-site/**
        - docs/**
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - Dockerfile
        - proxy/**
        - docs-site/**
        - docs/**
        - .gitlab-ci.yml
    - when: never

.tag_rules:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^(dev|staging|prod)-[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$/'
    - when: never

.prod_tag_rules:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^prod-[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$/'
    - when: never

.docker_job:
  image: docker:27.5.1-cli
  services:
    - name: docker:27.5.1-dind-rootless
      alias: docker
  tags:
    - homelab-rootless

go_test:
  extends: .proxy_rules
  stage: test
  image: golang:1.26.6-alpine
  tags:
    - homelab-rootless
  script:
    - cd proxy
    - go test ./...
    - go vet ./...

admin_ui_build:
  extends: .proxy_rules
  stage: test
  image: node:20-alpine
  tags:
    - homelab-rootless
  script:
    - cd proxy/admin-ui
    - npm ci
    - npm run build

docs_site_build:
  extends: .proxy_rules
  stage: test
  image: node:20-alpine
  tags:
    - homelab-rootless
  script:
    - cd docs-site
    - npm ci
    - npm run build

release_branch_guard:
  extends:
    - .tag_rules
  stage: release_guard
  image: alpine/git:2.49.1
  tags:
    - homelab-rootless
  script:
    - test -n "$RELEASE_BRANCH"
    - git fetch --no-tags origin "$RELEASE_BRANCH"
    - git merge-base --is-ancestor "$CI_COMMIT_SHA" "origin/$RELEASE_BRANCH" || { echo "release tag is not reachable from protected $RELEASE_BRANCH" >&2; exit 1; }

registry_smoke:
  extends:
    - .docker_job
    - .tag_rules
  stage: registry
  needs: [release_branch_guard]
  script:
    - test -n "${LAB_REGISTRY_HOST:-}" || (echo "LAB_REGISTRY_HOST is required" >&2; exit 1)
    - test -n "${LAB_REGISTRY_PUSH_USER:-}" || (echo "LAB_REGISTRY_PUSH_USER is required" >&2; exit 1)
    - test -n "${LAB_REGISTRY_PUSH_PASSWORD:-}" || (echo "LAB_REGISTRY_PUSH_PASSWORD is required" >&2; exit 1)
    - printf '%s' "$LAB_REGISTRY_PUSH_PASSWORD" | docker login "$LAB_REGISTRY_HOST" --username "$LAB_REGISTRY_PUSH_USER" --password-stdin
    - export SMOKE_IMAGE="$LAB_REGISTRY_HOST/$CI_PROJECT_PATH/ci-smoke:$CI_PIPELINE_ID"
    - printf 'FROM scratch\nLABEL org.opencontainers.image.revision="%s"\n' "$CI_COMMIT_SHA" | docker build -t "$SMOKE_IMAGE" -
    - docker push "$SMOKE_IMAGE"
    - docker pull "$SMOKE_IMAGE"
    - test -n "$(docker image inspect --format='{{index .RepoDigests 0}}' "$SMOKE_IMAGE")"
    - docker image rm "$SMOKE_IMAGE"
  after_script:
    - docker logout "$LAB_REGISTRY_HOST" >/dev/null 2>&1 || true

build_proxy_image:
  extends:
    - .docker_job
    - .tag_rules
  stage: build
  needs: [release_branch_guard]
  script:
    - test -n "${LAB_REGISTRY_HOST:-}" || (echo "LAB_REGISTRY_HOST is required" >&2; exit 1)
    - test -n "${LAB_REGISTRY_PUSH_USER:-}" || (echo "LAB_REGISTRY_PUSH_USER is required" >&2; exit 1)
    - test -n "${LAB_REGISTRY_PUSH_PASSWORD:-}" || (echo "LAB_REGISTRY_PUSH_PASSWORD is required" >&2; exit 1)
    - printf '%s' "$LAB_REGISTRY_PUSH_PASSWORD" | docker login "$LAB_REGISTRY_HOST" --username "$LAB_REGISTRY_PUSH_USER" --password-stdin
    - export IMAGE_REPOSITORY="$LAB_REGISTRY_HOST/$CI_PROJECT_PATH/proxy"
    - export IMAGE_TAG="$IMAGE_REPOSITORY:$CI_COMMIT_TAG"
    - docker build --pull --build-arg VERSION="$CI_COMMIT_TAG" --build-arg GIT_COMMIT="$CI_COMMIT_SHA" -t "$IMAGE_TAG" .
    - docker push "$IMAGE_TAG"
    - docker pull "$IMAGE_TAG"
    - export IMAGE_DIGEST="$(docker image inspect --format='{{index .RepoDigests 0}}' "$IMAGE_TAG")"
    - test "$IMAGE_DIGEST" = "$IMAGE_REPOSITORY@${IMAGE_DIGEST##*@}"
    - printf 'IMAGE_REPOSITORY=%s\nIMAGE_DIGEST=%s\n' "$IMAGE_REPOSITORY" "$IMAGE_DIGEST" > image.env
  artifacts:
    reports:
      dotenv: image.env
    paths:
      - image.env
    expire_in: 7 days
  after_script:
    - docker logout "$LAB_REGISTRY_HOST" >/dev/null 2>&1 || true

migrate_prod_db:
  extends:
    - .prod_tag_rules
  stage: migrate
  image: alpine:3.20
  tags:
    - homelab-rootless
  needs:
    - job: registry_smoke
    - job: build_proxy_image
      artifacts: true
  script:
    - apk add --no-cache openssh-client
    - test -n "${LAB_REGISTRY_HOST:-}" || (echo "LAB_REGISTRY_HOST is required" >&2; exit 1)
    - test -n "${LAB_REGISTRY_PULL_USER:-}" || (echo "LAB_REGISTRY_PULL_USER is required" >&2; exit 1)
    - test -n "${LAB_REGISTRY_PULL_PASSWORD:-}" || (echo "LAB_REGISTRY_PULL_PASSWORD is required" >&2; exit 1)
    - test -n "${MACOCR_MIGRATION_DATABASE_URL:-}" || (echo "MACOCR_MIGRATION_DATABASE_URL is required" >&2; exit 1)
    - test -n "${MACOCR_SWARM_MANAGER_HOST:-}" || (echo "MACOCR_SWARM_MANAGER_HOST is required" >&2; exit 1)
    - test -n "${MACOCR_SWARM_MANAGER_USER:-}" || (echo "MACOCR_SWARM_MANAGER_USER is required" >&2; exit 1)
    - test -n "${MACOCR_SWARM_SSH_PRIVATE_KEY:-}" || (echo "MACOCR_SWARM_SSH_PRIVATE_KEY is required" >&2; exit 1)
    - test -n "${MACOCR_SWARM_KNOWN_HOSTS:-}" || (echo "MACOCR_SWARM_KNOWN_HOSTS is required" >&2; exit 1)
    - install -m 0600 /dev/null deploy-key
    - printf '%s\n' "$MACOCR_SWARM_SSH_PRIVATE_KEY" > deploy-key
    - install -m 0644 /dev/null known-hosts
    - printf '%s\n' "$MACOCR_SWARM_KNOWN_HOSTS" > known-hosts
    - export SSH_OPTS="-i $CI_PROJECT_DIR/deploy-key -o UserKnownHostsFile=$CI_PROJECT_DIR/known-hosts -o StrictHostKeyChecking=yes -o ConnectTimeout=10"
    - export SWARM_TARGET="$MACOCR_SWARM_MANAGER_USER@$MACOCR_SWARM_MANAGER_HOST"
    - ssh $SSH_OPTS "$SWARM_TARGET" "docker network inspect pg-net >/dev/null"
    - printf '%s' "$LAB_REGISTRY_PULL_PASSWORD" | ssh $SSH_OPTS "$SWARM_TARGET" "docker login '$LAB_REGISTRY_HOST' --username '$LAB_REGISTRY_PULL_USER' --password-stdin"
    - printf 'DATABASE_URL=%s\n' "$MACOCR_MIGRATION_DATABASE_URL" | ssh $SSH_OPTS "$SWARM_TARGET" "docker run --rm --network pg-net --env-file /dev/stdin --entrypoint /usr/local/bin/macocr-admin '$IMAGE_DIGEST' migrate"
    - ssh $SSH_OPTS "$SWARM_TARGET" "docker logout '$LAB_REGISTRY_HOST' >/dev/null 2>&1 || true"

deploy_prod_swarm:
  extends:
    - .prod_tag_rules
  stage: deploy
  image: alpine:3.20
  tags:
    - homelab-rootless
  needs:
    - job: registry_smoke
    - job: build_proxy_image
      artifacts: true
    - job: migrate_prod_db
  environment:
    name: production
    url: https://ocr.dungxbuif.com
  script:
    - apk add --no-cache curl openssh-client
    - test -n "${LAB_REGISTRY_HOST:-}" || (echo "LAB_REGISTRY_HOST is required" >&2; exit 1)
    - test -n "${LAB_REGISTRY_PULL_USER:-}" || (echo "LAB_REGISTRY_PULL_USER is required" >&2; exit 1)
    - test -n "${LAB_REGISTRY_PULL_PASSWORD:-}" || (echo "LAB_REGISTRY_PULL_PASSWORD is required" >&2; exit 1)
    - test -n "${MACOCR_SWARM_MANAGER_HOST:-}" || (echo "MACOCR_SWARM_MANAGER_HOST is required" >&2; exit 1)
    - test -n "${MACOCR_SWARM_MANAGER_USER:-}" || (echo "MACOCR_SWARM_MANAGER_USER is required" >&2; exit 1)
    - test -n "${MACOCR_SWARM_SSH_PRIVATE_KEY:-}" || (echo "MACOCR_SWARM_SSH_PRIVATE_KEY is required" >&2; exit 1)
    - test -n "${MACOCR_SWARM_KNOWN_HOSTS:-}" || (echo "MACOCR_SWARM_KNOWN_HOSTS is required" >&2; exit 1)
    - install -m 0600 /dev/null deploy-key
    - printf '%s\n' "$MACOCR_SWARM_SSH_PRIVATE_KEY" > deploy-key
    - install -m 0644 /dev/null known-hosts
    - printf '%s\n' "$MACOCR_SWARM_KNOWN_HOSTS" > known-hosts
    - export SSH_OPTS="-i $CI_PROJECT_DIR/deploy-key -o UserKnownHostsFile=$CI_PROJECT_DIR/known-hosts -o StrictHostKeyChecking=yes -o ConnectTimeout=10"
    - export SWARM_TARGET="$MACOCR_SWARM_MANAGER_USER@$MACOCR_SWARM_MANAGER_HOST"
    - ssh $SSH_OPTS "$SWARM_TARGET" "docker service inspect --format '{{if .Spec.Mode.Replicated}}{{.Spec.Mode.Replicated.Replicas}}{{end}}' macocr-proxy" | grep -qx '1'
    - printf '%s' "$LAB_REGISTRY_PULL_PASSWORD" | ssh $SSH_OPTS "$SWARM_TARGET" "docker login '$LAB_REGISTRY_HOST' --username '$LAB_REGISTRY_PULL_USER' --password-stdin"
    - ssh $SSH_OPTS "$SWARM_TARGET" "docker service update --with-registry-auth --image '$IMAGE_DIGEST' --update-parallelism 1 --update-order stop-first --update-failure-action rollback --rollback-failure-action pause --detach=false macocr-proxy"
    - ssh $SSH_OPTS "$SWARM_TARGET" "docker logout '$LAB_REGISTRY_HOST' >/dev/null 2>&1 || true"

verify_prod_swarm:
  extends:
    - .prod_tag_rules
  stage: verify
  image: alpine:3.20
  tags:
    - homelab-rootless
  needs:
    - deploy_prod_swarm
  script:
    - apk add --no-cache curl
    - curl --fail --silent --show-error --retry 10 --retry-delay 3 https://ocr.dungxbuif.com/healthz
    - curl --fail --silent --show-error --retry 10 --retry-delay 3 https://ocr.dungxbuif.com/readyz
