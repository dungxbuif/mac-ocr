services:
  omniscan:
    build:
      context: ..
      dockerfile: Dockerfile.omniscan
    container_name: omniscan-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://omniscan:secretpassword@postgres:5432/omniscan?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: omniscan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: omniscan
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: omniscan
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omniscan -d omniscan"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: omniscan-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
